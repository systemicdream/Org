[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/systemicdream/Org"
homepage = "https://github.com/systemicdream/Org"

[workspace.dependencies]
org-syntax = { path = "crates/org-syntax" }
org-doc = { path = "crates/org-doc" }
org-editor = { path = "crates/org-editor" }
org-index = { path = "crates/org-index" }
org-agenda = { path = "crates/org-agenda" }
org-ui = { path = "crates/org-ui" }

# GPUI moves fast; pin exactly and upgrade deliberately.
# Features:
# - default features off: drops the X11 backend. On Linux, Org targets Wayland only.
# - `font-kit`: font loading (macOS and Linux). `wayland`: the Linux backend.
# - `runtime_shaders`: compile Metal shaders at launch instead of needing the Metal toolchain
#   (`xcodebuild -downloadComponent MetalToolchain`) at build time. Revisit for release builds.
gpui = { version = "=0.2.2", default-features = false, features = [
    "font-kit",
    "wayland",
    "runtime_shaders",
] }
orgize = { package = "orgize-ng", version = "=0.10.0-alpha.12" }
unicode-segmentation = "1.12"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Pure-Rust regex engine (no oniguruma C dependency).
syntect = { version = "=5.3.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
anyhow = "1"
notify = "9"
# Delete from the sidebar moves files to the system trash (macOS Trash, freedesktop trash).
trash = "5.4"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
# Update checks against GitHub Releases (rustls; no system OpenSSL).
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Lockfile pins (no manifest entry needed, but don't `cargo update` past them blindly):
# - libc 0.2.189 / mio 1.2.4: libc 0.2.190 removed `ENOATTR` on Linux, which breaks
#   xattr 0.2.3 (gpui 0.2.2 → gpui_http_client → zed-async-tar). Lift once gpui stops
#   depending on xattr 0.2. Verify with a Linux build after any `cargo update`.

[profile.dev.package."*"]
# Keep dependencies (GPUI especially) reasonably fast in debug builds.
opt-level = 2
