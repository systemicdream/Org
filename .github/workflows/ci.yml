name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is deferred (see docs/PLAN.md §3); add windows-latest back when it is picked up.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # libxkbcommon-x11-dev is needed even though Aster is Wayland-only: gpui 0.2.2 always
        # enables xkbcommon's `x11` feature, so it is required at link time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev \
            libfreetype-dev libvulkan-dev pkg-config
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
