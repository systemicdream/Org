# Flatpak manifest for Org: the main Linux package.
#
# Build a single-file bundle (needs flatpak-builder and the Flathub remote):
#   scripts/package-flatpak.sh
#
# Not on Flathub (yet), so the build fetches crates from crates.io directly (build-time network
# access, which Flathub doesn't allow; publishing there would need vendored cargo sources).
id: io.github.systemicdream.Org
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: org
finish-args:
  # Org is Wayland-only (no X11 fallback).
  - --socket=wayland
  - --device=dri
  # The notes folder can be anywhere in your home folder, and Org watches it for changes
  # made by sync services and other editors, which needs direct access (not the portal).
  - --filesystem=home
  # The daily update check (GitHub Releases).
  - --share=network
  # "Show in file manager".
  - --talk-name=org.freedesktop.FileManager1
modules:
  - name: org
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/org/cargo-home
        CARGO_TERM_COLOR: never
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked -p org-app
      - install -Dm755 target/release/org /app/bin/org
      - install -Dm644 packaging/linux/io.github.systemicdream.Org.desktop /app/share/applications/io.github.systemicdream.Org.desktop
      - install -Dm644 packaging/linux/io.github.systemicdream.Org.metainfo.xml /app/share/metainfo/io.github.systemicdream.Org.metainfo.xml
      - |
        for icon in packaging/linux/icons/hicolor/*/apps/io.github.systemicdream.Org.png; do
          size="$(basename "$(dirname "$(dirname "$icon")")")"
          install -Dm644 "$icon" "/app/share/icons/hicolor/$size/apps/io.github.systemicdream.Org.png"
        done
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
